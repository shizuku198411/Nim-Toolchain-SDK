name: SDK Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  pack-sdk:
    name: sdkcraft pack
    uses: canonical/sdkcraft-actions/.github/workflows/build.yml@main
    with:
      runs-on: ubuntu-latest
      run-tests: true

  test-try-sdk:
    name: sdkcraft try with Workshop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pack-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check WORKSHOP_TOKEN
        shell: bash
        run: |
          if [ -z "${WORKSHOP_TOKEN}" ]; then
            echo "WORKSHOP_TOKEN is empty"
            exit 1
          fi
          echo "WORKSHOP_TOKEN is set"
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Check token access to canonical/workshop
        if: ${{ !env.ACT }}
        shell: bash
        run: |
          status="$(
            curl -sS -o /tmp/workshop-repo.json -w '%{http_code}' \
              -H "Authorization: Bearer ${WORKSHOP_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/canonical/workshop
          )"
          echo "GitHub API status: ${status}"
          if [ "${status}" != "200" ]; then
            cat /tmp/workshop-repo.json
            exit 1
          fi
        env:
          WORKSHOP_TOKEN: ${{ secrets.WORKSHOP_TOKEN }}

      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: 6/stable

      - name: Install sdkcraft
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 10
          command: |
            sudo snap install sdkcraft --edge --classic
            sdkcraft --version

      - name: sdkcraft try
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 120
          command: |
            sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
            sudo ip6tables -I DOCKER-USER -i lxdbr0 -j ACCEPT
            sudo ip6tables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

            sg lxd -c 'sdkcraft try'

      - name: Launch workshop
        uses: canonical/launch-workshop@v0
        with:
          token: ${{ secrets.WORKSHOP_TOKEN }}
          workshop: nim-toolchain-try

      - name: Try SDK
        run: |
          workshop run nim-toolchain-try -- check-versions